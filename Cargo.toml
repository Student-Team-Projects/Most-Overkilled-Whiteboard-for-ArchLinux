[workspace]
members = ["crates/*"]
resolver = "3"
exclude = ["spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
publish = false

[workspace.dependencies]
wb-core = { path = "crates/wb-core" }
wb-codec = { path = "crates/wb-codec" }
wb-index = { path = "crates/wb-index" }
wb-net = { path = "crates/wb-net" }
wb-render = { path = "crates/wb-render" }
wb-sim = { path = "crates/wb-sim" }
eframe = "=0.36.2"
egui = "=0.36.2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
